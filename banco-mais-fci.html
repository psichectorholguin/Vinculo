<title>Banco MAIS-FCI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: una sola columna de lectura; una pregunta por pantalla, opciones como filas grandes tocables. */
:root{
  --bg:#f2f6f7; --surface:#ffffff; --fg:#13262b; --muted:#5a6f75; --line:#d3dfe2;
  --accent:#0b7285; --accent-fg:#ffffff;
  --ok:#1f7a3d; --ok-bg:#e3f4e8; --bad:#b42323; --bad-bg:#fbe7e7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e; --surface:#162529; --fg:#e4eef0; --muted:#93a9af; --line:#294048;
  --accent:#4fc3d6; --accent-fg:#06212a;
  --ok:#6fd48c; --ok-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1b1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e; --surface:#162529; --fg:#e4eef0; --muted:#93a9af; --line:#294048;
  --accent:#4fc3d6; --accent-fg:#06212a;
  --ok:#6fd48c; --ok-bg:#15301f; --bad:#ff8a8a; --bad-bg:#3a1b1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .25s}
.q{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.35;margin:0;text-wrap:pretty}
.detail{margin:0;padding:10px 14px 10px 34px;background:var(--bg);border-radius:8px;font-size:.95rem;display:flex;flex-direction:column;gap:3px}
.detail .extra{list-style:none;margin:6px 0 0 -20px;color:var(--muted);font-size:.9rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:48px;text-align:left;background:var(--surface);color:var(--fg);
  border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:var(--surface)}
.fb{padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb small{display:block;color:var(--muted);margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;min-height:48px;padding:0 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border:2px solid var(--line)}
.sw{display:flex;gap:10px;align-items:center;color:var(--muted);min-height:44px}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);margin:0;font-size:1.2rem}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style>

<div class="wrap">
  <div>
    <h1>Banco de preguntas MAIS-FCI</h1>
    <p class="sub">154 preguntas de selección múltiple para enfermería</p>
  </div>

  <div id="start" class="panel">
    <p style="margin:0">Elige una respuesta y verás al instante cuál es la correcta. Las preguntas que falles se guardan en este navegador para repasarlas otro día.</p>
    <label class="sw" for="shuffle"><input type="checkbox" id="shuffle"> Mezclar el orden de las preguntas</label>
    <div class="row">
      <button class="btn" id="go" type="button">Empezar</button>
      <button class="btn sec" id="saved" type="button" hidden></button>
    </div>
  </div>

  <div id="quiz" class="panel" hidden>
    <div class="top"><span id="counter"></span><span id="score"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <p class="q" id="qtext"></p>
    <ol class="detail" id="detail" hidden></ol>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" hidden></div>
    <div class="row"><button class="btn" id="next" type="button" hidden></button></div>
  </div>

  <div id="end" class="panel" hidden>
    <h2>Resultado</h2>
    <div class="big" id="final"></div>
    <p id="msg" style="margin:0"></p>
    <div class="row">
      <button class="btn" id="again" type="button">Reintentar todo</button>
      <button class="btn sec" id="rev" type="button">Repasar las falladas</button>
    </div>
  </div>
</div>

<script>
const DATA = [
{q:"¿Cuál es el nivel del sistema de atención en salud que corresponde a establecimientos como centros quirúrgicos ambulatorios, donde se brinda atención especializada sin hospitalización prolongada?",o:["Nivel III","Nivel II","Nivel I","Nivel IV"],c:1},
{q:"Como responsable del programa de garantía de la calidad, usted verifica que el personal de enfermería realice y registre en cada turno la valoración torácica, incluida la auscultación. ¿Qué tipo de evaluación está realizando con esta verificación?",o:["Evaluación de la estructura","Evaluación del profesional","Evaluación del resultado","Evaluación del proceso"],c:3},
{q:"En una institución de salud se observa que se establecen líneas directas de comunicación, se elimina la centralización en la toma de decisiones y se busca simplificar el trabajo. ¿A qué tipo de organización corresponden estas características?",o:["Por comités.","Funcional.","Lineo-funcional.","Lineal."],c:1},
{q:"Cuando el MAIS-FCI garantiza los derechos de las y los ciudadanos y la corresponsabilidad en el cumplimiento de los deberes hacia los otros, sus comunidades y la sociedad se está refiriendo a:",o:["Principios del Modelo de Atención Integral de Salud.","Objetivo del Modelo de Atención Integral de Salud.","Propósito del Modelo de Atención Integral de Salud.","Objetivos estratégicos para el fortalecimiento del Modelo de Atención Integral de Salud."],c:2},
{q:"De acuerdo al MAIS-FCI, cuando hay optimización y uso racional de los recursos orientados a la satisfacción de las necesidades de las personas, a la eficiencia del gasto, garantizando el uso adecuado y un mayor rendimiento de los recursos se refiere a:",o:["Objetivo del Modelo de Atención Integral de Salud.","Principios del Modelo de Atención Integral de Salud.","Propósito del Modelo de Atención Integral de Salud.","Objetivos estratégicos para el fortalecimiento del Modelo de Atención Integral de Salud."],c:2},
{q:"De las siguientes opciones, ¿cuáles son medidas de tendencia central usadas habitualmente en los análisis estadísticos?",d:["Intervalo de confianza","Moda","Varianza","Media","Desviación estándar","Mediana","Puntuaciones estandarizadas","Diagramas de dispersión"],o:["4, 5, 6","2, 4, 6","6, 7, 8","1, 2, 3"],c:1},
{q:"Seleccione la modalidad de atención del componente Provisión de Servicios del MAIS-FCI que presta un servicio operacional y de coordinación para los problemas médicos urgentes:",o:["Atención Individual.","Atención al ambiente.","Atención Prehospitalaria.","Atención Comunitaria."],c:2},
{q:"¿Cuál de los subsistemas del Sistema Integrado de Vigilancia Epidemiológica (SIVE) incluye los síndromes y enfermedades de alta capacidad de transmisión?",o:["SIVE-Especializado.","SIVE-Mortalidad.","SIVE-Hospital.","SIVE-Alerta."],c:3},
{q:"En un programa de salud donde se proponen soluciones innovadoras, la característica que es capaz de aportar nuevas ideas es:",o:["Flexibilidad y dinamismo.","Prospectividad.","Sistemática.","La creatividad."],c:3},
{q:"¿Cuál de los siguientes enunciados se acerca más a la definición de la Carta de Ottawa sobre Promoción de la Salud?",o:["Promocionar solamente un cambio de comportamiento individual.","Proporcionar condiciones para generar un cambio del entorno físico y socioeconómico de la población.","Proporcionar educación sanitaria para prevenir enfermedades crónicas.","Proporcionar a los pueblos los medios necesarios para mejorar su salud y ejercer mayor control sobre la misma."],c:3},
{q:"¿Cuál es el objetivo de la aplicación del test de APGAR familiar?",o:["Determinar una crisis familiar no normativa.","Evaluar el nivel de funcionamiento de la familia.","Evaluar la funcionalidad de la familia a través de una representación gráfica.","Determinar una crisis familiar normativa."],c:1},
{q:"¿Cuál de los siguientes estudios carece de formulación de hipótesis?",o:["Explicativo.","Exploratorio.","Correlacional.","Descriptivo."],c:1},
{q:"Como profesional de enfermería, líder del servicio de cirugía, debe planear y controlar las acciones. La gráfica del calendario de operaciones sobre el que se indican tiempos para la realización de cada actividad de quirófano se refiere a:",o:["Diagrama de Pert.","Diagrama de flujo.","Diagrama de Gantt.","Diagrama de Pareto."],c:2},
{q:"Como profesional de enfermería del centro de salud, debe realizar visitas domiciliarias. La etapa de la visita que le ayuda para continuar o modificar la planificación de los cuidados, detectar las dificultades, revisar los objetivos, planificar otros nuevos, corresponde a:",o:["Ejecución de la visita.","Planificación de la visita.","Evaluación de la visita.","Preparación de la visita."],c:2},
{q:"En una zona rural de difícil acceso con alta tasa de embarazos y escasa conexión al sistema de salud formal, los equipos comunitarios detectan signos de riesgo y ausencia de control prenatal. ¿Qué acción clave permite garantizar la referencia y contrarreferencia efectiva con participación comunitaria?",o:["Establecer rutas comunitarias de vigilancia para asegurar el traslado seguro hacia y desde los servicios sanitarios.","Iniciar procesos de capacitación en medicina tradicional para parteras.","Coordinar con líderes locales el transporte permanente hacia centros de salud.","Incrementar campañas educativas sobre signos de alarma durante el embarazo."],c:0},
{q:"Seleccione las variables que debe considerar para el manejo de la escala de riesgo de caída de MORSE:",d:["Estado mental.","Edad.","Ayuda para deambular.","Venoclisis.","Antecedentes.","Marcha."],o:["2, 3, 4, 6","1, 2, 4, 5","1, 3, 4, 6","1, 2, 5, 6"],c:2},
{q:"En el centro de salud donde usted trabaja se presenta el caso de una enfermedad con una incidencia mayor a la esperada para su área geográfica y período determinado. ¿Cuál es el tipo de vigilancia epidemiológica que corresponde a este caso?",o:["Epidemia.","Pandemia.","Endemia.","Brote."],c:3},
{q:"En una familia donde sus integrantes están sin trabajo, atraviesan una situación de pobreza, las relaciones intrafamiliares son violentas y no predominan la práctica de los valores. ¿A qué determinante de la salud, según Marc Lalonde, hace referencia el caso?",o:["Ambientales.","Biológicos.","Conductuales.","Sociales."],c:3},
{q:"Un grupo específico de personas vive en una parroquia rural, comparten la misma cultura, valores y normas. Al momento están organizadas en una estructura social por cabildo. En la valoración se detecta la necesidad de reorientar los servicios de salud hacia la comunidad. ¿Cuál de los siguientes enunciados define el concepto de comunidad cerrada?",o:["Una comunidad que se caracteriza por tener una diversidad cultural y étnica muy marcada.","Una comunidad que tiene fronteras geográficas claramente definidas y limita el acceso a personas externas.","Una comunidad que promueve la participación activa de sus miembros en actividades sociales y culturales.","Una comunidad que se enfoca principalmente en el desarrollo económico y la generación de empleo."],c:1},
{q:"Para el desarrollo de actividades comunitarias, el profesional de enfermería realiza las fichas familiares en el trabajo extramural y en la presentación de resultados se encuentra como problemas principales la pobreza, desnutrición infantil y la violencia intrafamiliar. ¿Qué determinantes de la salud constituyen factores de riesgo en este caso?",o:["Determinantes conductuales y ambientales.","Determinantes sociales y ambientales.","Determinantes biológicos y conductuales.","Determinantes biológicos y sociales."],c:3},
{q:"Si queremos realizar una investigación que estudie características humanas tales como la moralidad, la conducta cotidiana, la libertad, podemos decir que la metodología de investigación será de enfoque:",o:["Cuantitativo.","Cualitativo.","Experimental.","Observacional."],c:1},
{q:"La herramienta de diagnóstico que permite conocer en forma gráfica el proceso vivido por los actores locales, los factores de riesgo y protección: sanitario ambiental, socioeconómico y biológico, se refiere a:",o:["Diagnóstico dinámico.","Análisis situacional de salud.","Mapa parlante.","Sala situacional."],c:2},
{q:"Seleccione los elementos que constituyen el Componente de Provisión de Servicios de Salud del Sistema Nacional de Salud:",d:["Niveles de atención; homologación y tipología de establecimientos de salud.","Grupos de población a quienes se entregará la atención.","Herramientas de diagnóstico y monitoreo de las condiciones de salud.","Conjunto de prestaciones por ciclos de vida.","Organización territorial y funcionamiento de la Red Pública y complementaria.","Escenarios y modalidades de atención.","Estrategias y herramientas para brindar prestaciones integrales de salud."],o:["1, 5, 6, 7","2, 4, 6, 7","1, 3, 4, 6","2, 3, 5, 6"],c:1},
{q:"Un paciente joven, sin antecedentes de importancia, vive en zona tropical selvática y acude por presentar una lesión en la piel de la mejilla, provocada por una picadura de insecto. Desde hace un par de meses, la pápula tomó un color violeta, tiende a crecer y a ulcerarse. Al examen físico tiene una lesión papular indurada, color rojo vinoso, con halo eritematoso, de unos 6 cm de diámetro, cubierta de una capa escamosa y en el centro tiene una costra redondeada de 4 cm de diámetro, no es dolorosa. El frotis encuentra macrófagos y escasos microorganismos en formas amastigotes (Leishmaniasis). ¿Cuál de los siguientes fármacos está indicado como tratamiento de primera línea?",o:["Ivermectina","Antimonio pentavalente","Ceftriaxona","Estreptomicina"],c:1},
{q:"“Se deben crear espacios de gestión y autogestión, donde los conjuntos sociales y los trabajadores de la salud concerten sobre los procesos de identificación de problemas, el establecimiento de prioridades y la búsqueda de soluciones”. ¿A qué tipo de integralidad corresponde el enunciado?",o:["Integralidad en la atención individual y familiar","Integralidad en la participación de la comunidad","Integralidad en la gestión institucional","Integralidad en las acciones intersectoriales"],c:1},
{q:"En el Hospital Gineco-obstétrico Nueva Aurora se requiere realizar una investigación acerca de la leche materna de una paciente de 24 años que perdió a su hijo por una sepsis neonatal y que desea donar leche materna para un bebé que fue abandonado en la sala donde se encontraba su hijo. Se envía al CEISH del Hospital de Solca de Quito para obtener la aprobación. El CEISH evalúa el balance de los riesgos y beneficios potenciales. ¿Qué tipo de riesgo califica el CEISH a la investigación propuesta?",o:["Investigación sin riesgo","Investigación de muestras biológicas anonimizadas","Investigación de riesgo mínimo","Investigación de riesgo mayor al mínimo"],c:2},
{q:"¿Cuáles son los elementos del planteamiento del problema de investigación en el proceso cuantitativo?",o:["Diseño, métodos, instrumentos, población","Discusión, análisis, conclusiones, recomendaciones","Marco referencial, marco conceptual, marco legal, marco ético","Objetivos, preguntas directrices, justificación y viabilidad"],c:3},
{q:"Cuando el MAIS-FCI orienta el accionar integrado de los actores del Sistema Nacional de Salud hacia la garantía de los derechos en salud y el cumplimiento de las metas del Plan Nacional de Desarrollo, al mejorar las condiciones de vida y salud de la población ecuatoriana, bajo los principios de la Estrategia de Atención Primaria de Salud Renovada. ¿A qué se está refiriendo?",o:["Propósito del Modelo de Atención Integral de Salud","Objetivo del Modelo de Atención Integral de Salud","Objetivos estratégicos para el fortalecimiento del Modelo de Atención Integral de Salud","Principios del Modelo de Atención Integral de Salud"],c:0},
{q:"El Modelo de Atención Integral de Salud Familiar, Comunitario e Intercultural orienta el accionar integrado de los actores del Sistema Nacional de Salud hacia la garantía de los derechos en salud y en cumplimiento de las metas del Plan Nacional de Desarrollo para el Buen Vivir al mejorar las condiciones de vida y salud de la población. Esta definición hace énfasis a:",o:["Integralidad.","Propósito.","Principios.","Objetivo."],c:1},
{q:"¿Cuál de los siguientes enunciados es correcto con respecto a los cambios relacionados con el envejecimiento?",o:["Disminución de la grasa subcutánea, del líquido intersticial y de los receptores sensoriales","Las mujeres presentan un ensanchamiento vaginal con aumento de las secreciones vaginales","Aumento de la sensación de sed, aumento de la salivación y vaciamiento gástrico acelerado","Aumento del gasto cardiaco y disminución de la tensión arterial"],c:0},
{q:"Durante una jornada comunitaria organizada por el personal de salud en una población de 3 500 habitantes, se reunieron miembros de la comunidad, instituciones educativas y fuerzas del orden para identificar prioridades en salud. ¿Qué objetivo del Modelo de Atención Integral de Salud del Ecuador se refleja en esta actividad?",o:["Mejorar la cobertura y calidad en los niveles de referencia y contrarreferencia.","Promover la participación comunitaria en la planificación y ejecución de intervenciones de salud.","Impulsar procesos educativos continuos para el personal sanitario.","Implementar vigilancia epidemiológica institucional."],c:1},
{q:"Las entrevistas colectivas ayudan a recolectar datos sobre un tema investigado. ¿Cómo se denomina esta técnica?",o:["Grupos de enfoque","Cuestionarios","Escalas de actitudes","Entrevistas"],c:0},
{q:"¿Cuál es la herramienta comunitaria que permite representar gráficamente el territorio, identificar riesgos, ubicar actores clave y visualizar factores socioambientales, sanitarios y de estilo de vida?",o:["Registro cartográfico de viviendas.","Mapa parlante comunitario.","Diagnóstico participativo básico.","Croquis de ubicación de actores sociales."],c:1},
{q:"Seleccione los factores causales de los efectos adversos que afectan la cultura de seguridad en los servicios de salud:",o:["Escasez de materiales hospitalarios, personal no profesional, poco mantenimiento.","Comunicación deficiente, incorrecta ejecución de procedimientos, turnos excesivos.","Estados del paciente, funcionamiento deficiente de equipos, ambiente desfavorable.","Comorbilidad del paciente, poca tecnología de equipos, desmotivación del personal."],c:1},
{q:"El componente organización del Sistema Nacional de Salud da provisión de servicio por niveles de atención. Relacione el nivel al que corresponde cada una de las prestaciones:",d:["Primer nivel de atención","Segundo nivel de atención","Tercer nivel de atención","Cuarto nivel de atención"],extra:"Prestaciones: a) Servicio de atención integral dirigida al individuo y comunidad, con énfasis en promoción y prevención. b) Concentra la experimentación clínica pre-registro, procedimientos cuya evidencia no es suficiente. c) Comprende todas las acciones de atención ambulatoria especializada y las que requieren hospitalización. d) Establecimientos que prestan servicios ambulatorios y hospitalarios de especialidad y especializados.",o:["1c, 2b, 3a, 4d","1a, 2c, 3d, 4b","1b, 2c, 3d, 4a","1d, 2a, 3b, 4c"],c:1},
{q:"En el servicio de consulta externa debe planificar una charla educativa sobre hipertensión arterial dirigida a los pacientes que reciben atención en esta casa de salud; para su intervención debe basar su actuación en un modelo de enfermería. ¿Cuál es la teorizante que utilizaría en este caso?",o:["Virginia Henderson","Dorothea Orem","Nola Pender","Hildegard Peplau"],c:2},
{q:"Como profesional del equipo de trasplante de órganos, usted recibe un donante que, tras haber sufrido un accidente automovilístico, ingresa al servicio de emergencia con diagnóstico de muerte cerebral. ¿Cuál es la clasificación que le corresponde a este paciente según la Escala de Riesgo Anestésico (ASA)?",o:["ASA 6","ASA 5","ASA 4","ASA 3"],c:0},
{q:"En la cadena epidemiológica, ¿cuál es el nombre del elemento que se refiere al hábitat natural de un agente infeccioso, sea una persona, animal, planta o material inanimado?",o:["Agente","Fuente de infección","Reservorio","Huésped"],c:2},
{q:"Según la política de frasco abierto, luego de haber sido reconstituidas las vacunas SRP multidosis, SR, BCG y Antiamarílica, ¿cuál es el tiempo máximo recomendable de uso?",o:["12 horas y descartar","2 horas y descartar","6 horas y descartar","8 horas y descartar"],c:2},
{q:"Paciente femenina de 55 años acude a consulta externa; al interrogatorio refiere que tiene contacto con un familiar diagnosticado con tuberculosis alrededor de 5 horas diarias. ¿Cómo clasifica a este contacto?",o:["Contacto examinado.","Contacto frecuente.","Contacto íntimo.","Contacto esporádico."],c:1},
{q:"Durante una evaluación domiciliaria, una mujer informa que vive con su esposo, su hijo y que ambos tienen hijos de relaciones anteriores. No se identifican riesgos ni disfuncionalidades. ¿Cómo se clasifica este tipo de estructura familiar?",o:["Familia de acogida, que recibe temporalmente a menores ajenos al núcleo biológico.","Familia extendida, que incluye abuelos u otros parientes consanguíneos.","Familia nuclear, compuesta únicamente por padres e hijos biológicos en común.","Familia mixta, formada por miembros de núcleos anteriores que conviven como una unidad."],c:3},
{q:"Dentro del MAIS-FCI, ¿cómo se denomina la modalidad que abarca la asistencia médica de emergencia, rescate y traslado de pacientes antes de su ingreso a un establecimiento de salud?",o:["Atención en establecimientos móviles.","Atención institucionalizada.","Atención prehospitalaria.","Atención extramural."],c:2},
{q:"El aumento a nivel de las células en número y/o en tamaño tiene relación con la edad en las dos primeras décadas de la vida. Esta definición corresponde a:",o:["Desarrollo.","Crecimiento.","Osmolaridad.","Maduración."],c:1},

{q:"La familia Paredes mantiene contacto con el Dr. Basantes, puesto que realiza una visita domiciliaria cada dos semanas. Durante las últimas visitas se han encontrado diversas irregularidades en el comportamiento del hijo mayor, le ha realizado distintos test y se ha diagnosticado un Trastorno Obsesivo Compulsivo de la Personalidad (TOC). Tras explicar a los miembros familiares (qué es, cómo se trata, qué opciones de tratamiento tienen, cómo sobrellevarlo), se da inicio a la terapia cognitivo conductual. Esta terapia considera los cinco niveles para evaluar el grado en que se adopta una orientación familiar en la práctica médica. ¿Qué nivel de evolución considera abordar el médico en este caso?",o:["Cuarto nivel: evaluación sistemática e intervención planificada", "Quinto nivel: Terapia familiar", "Tercer nivel: Sentimiento y apoyo", "Segundo nivel: proporcionar orientación continua y consejos médicos"],c:0},

{q:"De acuerdo con la clasificación de los servicios de salud por niveles de atención y capacidad resolutiva, ¿qué comprende el segundo nivel de atención?",o:["Cubrir a toda la población, resolver las necesidades básicas y/o más frecuentes de la comunidad. Los servicios darán atención integral dirigida a la familia, individuo y comunidad, enfatizando en la promoción y prevención.", "Atender al usuario desde que se comunica un evento que amenaza la salud, en cualquier lugar donde éste ocurra, hasta que él o los pacientes sean admitidos en la unidad de emergencia, u otro establecimiento de salud, cuya capacidad resolutiva sea la adecuada.", "Prestar servicios ambulatorios y hospitalarios de especialidad y especializados, los centros hospitalarios son de referencia nacional; resuelve los problemas de salud de alta complejidad.", "Realizar acciones y servicios de atención ambulatoria especializada y aquellas que requieran hospitalización."],c:3},
{q:"En la visita domiciliaria de enfermería detecta un grupo de pacientes con hábitos de tabaquismo; como parte de su trabajo, sus pacientes establecen un compromiso individual y grupal por modificar este hábito. ¿Cuál de las siguientes teorías tiene mayor aplicabilidad en la situación expuesta?",o:["Teoría de Hildegard E. Peplau", "Teoría de Nola J. Pender", "Filosofía de Florence Nightingale", "Filosofía de Virginia Henderson"],c:1},
{q:"En un sector de una comunidad, por razones de trabajo minero existe una alta migración de un grupo étnico, usted debe atender a esa comunidad. Al realizar el plan operativo, ¿cuál sería el objetivo prioritario del Plan, tomando en cuenta el enfoque intercultural?",o:["Particularizar los servicios de atención de salud a los grupos de riesgo para mejorar el acceso a los servicios.", "Reconocer las necesidades de salud del grupo étnico de acuerdo a sus costumbres.", "Reconocer e incorporar los conocimientos y las prácticas de salud ancestrales en el plan.", "Mejorar las relaciones entre proveedores de salud y usuarios con distintas demandas de atención de salud."],c:2},

{q:"La cadena de frío para la conservación de las vacunas utiliza los termos, que son recipientes de pequeñas dimensiones que permiten transportar y conservar las vacunas a una temperatura de +2 °C a +8 °C; sin ser abiertos conservan la temperatura hasta 36 horas y 22.5 horas al abrirlos unas 16 veces con 2 minutos de duración cada vez. ¿Cuáles son las recomendaciones para mantener la temperatura correcta de las vacunas dentro del termo?",o:["Colocar las vacunas en vasos plásticos, evitar que el agua del deshielo de los paquetes fríos moje las vacunas.", "Mantener la tapa del termo bien cerrada para que las vacunas estén en contacto con el agua del deshielo.", "Llenar de agua todo el paquete frío y colocar esponjas o cualquier otro material dentro del termo.", "Colocar el termo a la sombra o en el lugar lo más fresco posible, evitar mantener la tapa del termo abierta."],c:0},
{q:"Un profesional de enfermería aplica los fundamentos de educación y comunicación para la promoción de la salud en su área de influencia. Al momento pretende desarrollar prácticas y actitudes que tengan incidencia sobre los determinantes de la salud a nivel comunitario. En el interrogatorio a un grupo focal encuentra prácticas potencialmente dañinas como la colocación de tela de araña en el ombligo de los recién nacidos. ¿Cómo se evidenciaría el enfoque sociocrítico en la promoción de la salud en este caso?",o:["Promoción de la salud en contextos socioculturales, acción - reflexión - acción.", "Promoción de la salud desconociendo prácticas de su entorno social.", "Transferencia de conocimientos como visión principal para la promoción de la salud.", "Características psicoevolutivas en educación para la salud entendida como un objetivo de vida."],c:0},

{q:"Usted como coordinador de Enfermería quiere evaluar la producción del personal de los servicios críticos, para lo cual debe basar su actuación en una teoría administrativa que mida la eficiencia y la productividad, dando como resultado un pago a los trabajadores. ¿Cuál autor menciona dicho enfoque?",o:["Henry Laurence Gantt.", "Douglas McGregor.", "Frederick Winslow Taylor.", "Elton Mayo."],c:2},
{q:"La Organización Mundial de la Salud ponderó los riesgos y los beneficios para la salud respecto a la prescripción y uso de los métodos anticonceptivos, por lo tanto estableció criterios de elección. ¿A qué categoría corresponde una condición en la que, en general, los riesgos teóricos o comprobados superan las ventajas de usar el método?",o:["Categoría 2.", "Categoría 4.", "Categoría 3.", "Categoría 1."],c:2},
{q:"Durante las visitas domiciliarias programadas por parte del personal de salud, se aplican diversas acciones orientadas a mejorar la calidad de vida de los individuos y sus familias en su entorno habitual. ¿Cuáles de las siguientes actividades forman parte de esta atención?",d:["Evaluación oportuna de enfermedades y discapacidades.", "Intervenciones en cuidados paliativos para el paciente y su núcleo familiar.", "Promoción de la participación comunitaria en programas sociales.", "Identificación de factores de riesgo ambiental y ocupacional.", "Diseño de planes operativos territoriales.", "Coordinación intersectorial para el desarrollo comunitario.", "Seguimiento organizado y continuo de la salud familiar"],o:["1, 2, 4, 7", "1, 3, 4, 6", "2, 4, 6, 7", "2, 3, 5, 6"],c:0},

{q:"Relacione la notificación del evento con su definición. Eventos: 1. Cuasi eventos. 2. Eventos adversos. 3. Eventos centinela. Definiciones: a) Evento que causa un daño involuntario al paciente por un acto de comisión o de omisión, no por la enfermedad o el trastorno de fondo del paciente. b) Todo evento adverso que haya derivado en la muerte del paciente o la pérdida importante o permanente de una función, de carácter imprevisto y sin relación con la enfermedad del paciente. c) Error de comisión o por omisión que podría haber causado daño al paciente, pero no produjo un daño grave gracias a la casualidad, a la prevención o a la atenuación.",o:["1c, 2a, 3b", "1a, 2b, 3c", "1b, 2a, 3c", "1b, 2c, 3a"],c:0},
{q:"Relacione la competencia de enfermería con la práctica profesional. Competencias: 1. Práctica basada en la evidencia. 2. Mejorar la calidad. 3. Cuidados centrados en el paciente. 4. Trabajo en equipo y de colaboración. Prácticas: a) Utilizar herramientas como diagramas de flujo para hacer explícito el proceso de atención. b) Implicar a los amigos y la familia en los cuidados. c) Reconocer las contribuciones de otros miembros del equipo sanitario. d) Demostrar conocimientos de los métodos científicos básicos.",o:["1a, 2c, 3b, 4d", "1d, 2a, 3b, 4c", "1b, 2c, 3a, 4d", "1c, 2b, 3d, 4a"],c:1,note:"Esta pregunta no tenía respuesta marcada en tu archivo; la respuesta indicada se deduce de las definiciones."},
{q:"De acuerdo al MAIS-FCI, cuando se integra a la salud desde una visión multidimensional y biopsicosocial tanto individual como colectiva actuando sobre los riesgos y condiciones que afectan la salud, identificando y potenciando los factores protectores de la salud, articulando acciones de promoción, prevención, recuperación, rehabilitación, cuidados paliativos de las personas, familias, comunidad y su entorno, se refiere a:",o:["Objetivos estratégicos para el fortalecimiento del Modelo de Atención Integral de Salud.", "Objetivo del Modelo de Atención Integral de Salud.", "Propósito del Modelo de Atención Integral de Salud.", "Principios del Modelo de Atención Integral de Salud."],c:3},

{q:"El responsable de la gerencia de una maternidad en la sierra centro busca gestionar recursos. ¿Cuál estrategia permite la optimización de la vacuna BCG en recién nacidos?",o:["Utilizar la vacuna únicamente en hijos de madres seropositivas para VIH, que hayan tenido exposición perinatal.", "Vacunar a todos los niños dentro de las primeras 24 horas de nacidos o al primer contacto del niño/a con los servicios de salud, hasta los 11 meses 29 días de edad.", "En lugar de vacunación, se recomienda iniciar tratamiento antituberculoso con medicamentos en presencia de sintomatología.", "Para gestionar recursos no se implementa la vacuna BCG ya que se reserva para población con formas graves como Tb meníngea y miliar."],c:1},

{q:"Para el año 2015, la ONU aprobó la Agenda 2030 sobre el Desarrollo Sostenible, el primer objetivo es el fin de la pobreza; seleccione las metas de este objetivo:",d:["Formulación de políticas donde se creen entornos propicios para generar oportunidades de empleo.", "Promover una mejor salud para todos, especialmente para los más vulnerables.", "Que todas las personas puedan acceder a los servicios de salud de calidad.", "Poner en práctica a nivel nacional sistemas apropiados de protección social para todos.", "Elevar la productividad económica mediante la modernización tecnológica y la innovación.", "En el sector privado promover oportunidades económicas (microempresas)."],o:["2, 3, 5", "1, 5, 6", "2, 3, 6", "1, 4, 6"],c:3},

{q:"Un equipo de salud de un centro tipo B desarrolla su labor en base a los principios de la atención primaria renovada, con énfasis en la participación comunitaria y acciones intersectoriales. ¿Cuál es la característica fundamental de este enfoque en el contexto del MAIS?",o:["Dar prioridad a la atención especializada frente a enfermedades prevalentes.", "Impulsar el acceso de la población a hospitales de tercer nivel.", "Disminuir el costo de los tratamientos médicos para facilitar su cobertura.", "Reforzar las acciones comunitarias en salud basadas en prevención, promoción y abordaje integral."],c:3},

const L=["A","B","C","D"], KEY="cuestionario-mais-fcl-falladas";
let list=[],i=0,score=0,answered=false,wrong=[];
const $=id=>document.getElementById(id);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v:[]}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function refreshSaved(){
  const s=load().filter(n=>n>=0&&n<DATA.length);
  const b=$("saved");
  b.hidden=!s.length;
  b.textContent="Repasar falladas guardadas ("+s.length+")";
}
function begin(ids){
  list=ids;i=0;score=0;wrong=[];
  $("start").hidden=true;$("end").hidden=true;$("quiz").hidden=false;
  show();
}
function show(){
  answered=false;
  const d=DATA[list[i]];
  $("counter").textContent="Pregunta "+(i+1)+" de "+list.length;
  $("score").textContent="Aciertos: "+score;
  $("prog").style.width=(i/list.length*100)+"%";
  $("qtext").textContent=d.q;
  const det=$("detail");det.innerHTML="";
  if(d.d){
    d.d.forEach(t=>{const li=document.createElement("li");li.textContent=t;det.appendChild(li)});
    if(d.extra){const li=document.createElement("li");li.className="extra";li.textContent=d.extra;det.appendChild(li)}
    det.hidden=false;
  } else det.hidden=true;
  const box=$("opts");box.innerHTML="";
  d.o.forEach((t,k)=>{
    const b=document.createElement("button");
    b.type="button";b.className="opt";
    const a=document.createElement("span");a.className="l";a.textContent=L[k];
    const s=document.createElement("span");s.textContent=t;
    b.append(a,s);b.onclick=()=>pick(k);box.appendChild(b);
  });
  $("fb").hidden=true;$("fb").innerHTML="";
  $("next").hidden=true;
  $("next").textContent=i===list.length-1?"Ver resultado":"Siguiente";
}
function pick(k){
  if(answered)return;answered=true;
  const id=list[i],d=DATA[id],btns=$("opts").children;
  for(let j=0;j<btns.length;j++){btns[j].disabled=true;if(j===d.c)btns[j].classList.add("ok")}
  const fb=$("fb");fb.hidden=false;
  let s=load();
  if(k===d.c){
    score++;fb.className="fb ok";fb.innerHTML="<strong>¡Correcto!</strong>";
    s=s.filter(n=>n!==id);
  }else{
    btns[k].classList.add("bad");wrong.push(id);
    fb.className="fb bad";fb.innerHTML="<strong>Incorrecto.</strong> La respuesta correcta es la <strong>"+L[d.c]+"</strong>.";
    if(!s.includes(id))s.push(id);
  }
  save(s);
  if(d.note){const sm=document.createElement("small");sm.textContent=d.note;fb.appendChild(sm)}
  $("score").textContent="Aciertos: "+score;
  $("next").hidden=false;
}
$("next").onclick=()=>{i++;if(i>=list.length)finish();else show()};
function finish(){
  $("quiz").hidden=true;$("end").hidden=false;
  const pct=Math.round(score/list.length*100);
  $("final").textContent=score+" / "+list.length+" ("+pct+"%)";
  $("msg").textContent=pct>=80?"Muy buen resultado.":pct>=60?"Vas bien, repasa las falladas.":"Repasa las falladas y vuelve a intentarlo.";
  $("rev").hidden=!wrong.length;
  refreshSaved();
}
function allIds(){const a=DATA.map((_,k)=>k);if($("shuffle").checked)a.sort(()=>Math.random()-.5);return a}
$("go").onclick=()=>begin(allIds());
$("again").onclick=()=>begin(allIds());
$("rev").onclick=()=>begin(wrong.slice());
$("saved").onclick=()=>begin(load().filter(n=>n>=0&&n<DATA.length));
refreshSaved();
</script>
